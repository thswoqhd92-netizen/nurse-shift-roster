<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0e6b66" />
<title>간호사 근무표</title>
<style>
:root {
  --bg: #f3efe6;
  --card: #fffdf8;
  --ink: #1c2430;
  --muted: #5f675c;
  --line: #e6dfd2;
  --teal: #0e6b66;
  --teal-soft: #e5f3f1;
  --amber: #fff6e4;
  --amber-ink: #8a5a10;
  --red-bg: #fdecea;
  --red: #9d342c;
  --shadow: 0 10px 30px rgba(60, 48, 20, 0.06);
  --d: #8a5a00;
  --d-bg: #fff1cc;
  --e: #a84812;
  --e-bg: #ffe6d8;
  --n: #243e78;
  --n-bg: #e5ecf8;
  --off: #246348;
  --off-bg: #e5f2ea;
  --req: #9d342c;
  --req-bg: #fde8e4;
  --sun: #c44747;
  --sat: #2a62b0;
  --nav: 74px;
  color-scheme: light;
  font-family: "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12161c;
    --card: #1c232c;
    --ink: #f3f0e8;
    --muted: #b4b8b0;
    --line: #313842;
    --teal: #7dcec6;
    --teal-soft: #1a3331;
    --amber: #3a2e1c;
    --amber-ink: #f0cf96;
    --red-bg: #3a2220;
    --red: #ffb4ac;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    --d: #ffd78a;
    --d-bg: #3d3218;
    --e: #ffc2a8;
    --e-bg: #3d291c;
    --n: #c9d7f5;
    --n-bg: #243044;
    --off: #b7e0c8;
    --off-bg: #1d3328;
    --req: #ffb4ac;
    --req-bg: #3a2220;
    --sun: #ff9d9d;
    --sat: #9ec0ff;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { opacity: 0.55; cursor: default; }

#app { min-height: 100vh; }

.wrap {
  width: min(1080px, 100%);
  margin: 0 auto;
  padding: 16px 14px calc(var(--nav) + 22px + env(safe-area-inset-bottom));
}

.top {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: flex-end;
  margin-bottom: 14px;
}
.eyebrow { margin: 0 0 4px; color: var(--teal); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; }
h1 { margin: 0; font-size: 26px; line-height: 1.2; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: var(--shadow);
  padding: 14px;
  margin-bottom: 12px;
}
.card h2 { margin: 0 0 8px; font-size: 17px; }
.help { margin: 0 0 12px; color: var(--muted); font-size: 13px; line-height: 1.5; }

.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field.grow { flex: 1; }
.field span, .label { font-size: 12px; color: var(--muted); font-weight: 700; }
input[type="text"], input[type="number"], input[type="time"], input[type="date"], input[type="search"], select {
  width: 100%;
  border: 1px solid var(--line);
  background: transparent;
  border-radius: 12px;
  padding: 11px 12px;
  outline: none;
}
input:focus, select:focus { border-color: var(--teal); }

.btn, .btn-ghost, .btn-tiny {
  border: 0;
  border-radius: 999px;
  padding: 11px 14px;
  background: var(--teal);
  color: white;
  font-weight: 700;
}
@media (prefers-color-scheme: dark) {
  .btn { color: #10211f; }
}
.btn-ghost, .btn-tiny { background: var(--teal-soft); color: var(--teal); }
.btn-tiny { padding: 7px 10px; font-size: 12px; }
.btn.danger, .btn-tiny.danger { background: var(--red-bg); color: var(--red); }
.btn.wide { width: 100%; }

.nav {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 4px;
  padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
  background: var(--card);
  border-top: 1px solid var(--line);
  backdrop-filter: blur(10px);
  z-index: 5;
}
.nav button {
  border: 0;
  background: transparent;
  border-radius: 12px;
  padding: 6px 0;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
}
.nav button.on { background: var(--teal-soft); color: var(--teal); }

.month-switch { display: flex; align-items: center; gap: 8px; }
.month-switch strong { min-width: 92px; text-align: center; font-size: 16px; }

.staff-item, .share-item, .holi {
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
}
.staff-item:last-child, .share-item:last-child, .holi:last-child { border-bottom: 0; }
.staff-item .who { flex: 1; min-width: 120px; }
.role-tag, .pill {
  display: inline-flex;
  align-items: center;
  border-radius: 999px;
  padding: 3px 8px;
  background: var(--teal-soft);
  color: var(--teal);
  font-size: 12px;
  font-weight: 700;
}

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; }
.chip {
  border: 1px solid var(--line);
  background: transparent;
  border-radius: 999px;
  padding: 8px 12px;
  white-space: nowrap;
  font-weight: 700;
}
.chip.on { background: var(--teal); color: white; border-color: var(--teal); }
@media (prefers-color-scheme: dark) {
  .chip.on { color: #10211f; }
}

.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.dow, .day {
  text-align: center;
  border-radius: 12px;
  min-width: 0;
}
.dow { color: var(--muted); font-size: 12px; font-weight: 700; padding: 4px 0; }
.dow.sun { color: var(--sun); }
.dow.sat { color: var(--sat); }
.day {
  border: 1px solid var(--line);
  background: transparent;
  min-height: 74px;
  padding: 6px 2px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.day .n { font-weight: 800; font-size: 13px; }
.day.sun .n, .day.holi .n { color: var(--sun); }
.day.sat .n { color: var(--sat); }
.day.out { visibility: hidden; }
.day.today { outline: 2px solid var(--teal); }
.day small { color: var(--muted); font-size: 10px; line-height: 1.2; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge {
  border-radius: 999px;
  padding: 3px 6px;
  font-size: 11px;
  font-weight: 800;
  line-height: 1.2;
  white-space: nowrap;
}
.badge.D { background: var(--d-bg); color: var(--d); }
.badge.E { background: var(--e-bg); color: var(--e); }
.badge.N { background: var(--n-bg); color: var(--n); }
.badge.OFF { background: var(--off-bg); color: var(--off); }
.badge.REQ { background: var(--req-bg); color: var(--req); }
.day.on { background: var(--req-bg); border-color: var(--req); }
.cal-scroll { overflow-x: auto; padding-bottom: 6px; }
.cal.all { grid-template-columns: repeat(7, minmax(0, 1fr)); min-width: 0; }
.day.all { align-items: stretch; text-align: left; min-height: 0; padding: 6px; gap: 2px; }
.day-top { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; }
.who-block { display: flex; flex-direction: column; align-items: stretch; gap: 2px; margin-top: 6px; }
.day.all .who {
  border: 0;
  border-radius: 7px;
  padding: 2px 4px;
  text-align: left;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.35;
  background: transparent;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.who.D { background: var(--d-bg); color: var(--d); }
.who.E { background: var(--e-bg); color: var(--e); }
.who.N { background: var(--n-bg); color: var(--n); }
.who.OFF { background: var(--off-bg); color: var(--off); }
.who.REQ { background: var(--req-bg); color: var(--req); }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--teal-soft); border-radius: 14px; padding: 10px; }
.stat b { display: block; font-size: 18px; }
.stat span { color: var(--muted); font-size: 12px; }

.note, .warn, .bad, .ok {
  border-radius: 14px;
  padding: 10px 12px;
  margin: 8px 0;
  font-size: 13px;
  line-height: 1.45;
}
.note { background: var(--teal-soft); }
.warn { background: var(--amber); color: var(--amber-ink); }
.bad { background: var(--red-bg); color: var(--red); }
.ok { background: var(--off-bg); color: var(--off); }
.warn ul, .bad ul { margin: 6px 0 0; padding-left: 18px; }

.table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; }
table { border-collapse: collapse; width: max-content; min-width: 100%; font-size: 12px; }
th, td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 4px; text-align: center; min-width: 28px; }
th:first-child, td:first-child {
  position: sticky;
  left: 0;
  background: var(--card);
  min-width: 76px;
  text-align: left;
  z-index: 1;
  font-weight: 700;
}
thead th { position: sticky; top: 0; background: var(--card); z-index: 2; }
thead th:first-child { z-index: 3; }
td.D { background: var(--d-bg); color: var(--d); font-weight: 800; }
td.E { background: var(--e-bg); color: var(--e); font-weight: 800; }
td.N { background: var(--n-bg); color: var(--n); font-weight: 800; }
td.OFF { background: var(--off-bg); color: var(--off); }
td.REQ { background: var(--req-bg); color: var(--req); font-weight: 800; }
td button, th { border: 0; background: transparent; width: 100%; font-weight: 800; }
.sunh { color: var(--sun); }
.sath { color: var(--sat); }
.todayh { box-shadow: inset 0 -2px 0 var(--teal); }

.fair { width: 100%; border-collapse: collapse; font-size: 13px; }
.fair { width: max-content; min-width: 100%; }
.fair th, .fair td { white-space: nowrap; text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); min-width: 0; }

.legend { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.person-head { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.hidden-file { display: none; }

@media (max-width: 720px) {
  h1 { font-size: 22px; }
  .grid-2, .stats { grid-template-columns: 1fr; }
  .day { min-height: 68px; }
  .wrap { padding-left: 8px; padding-right: 8px; }
  .card { padding: 10px; }
  .cal, .cal.all { gap: 3px; }
  .day.all { padding: 3px 1px; border-radius: 8px; gap: 1px; }
  .day.all .n { font-size: 12px; }
  .day.all small { display: none; }
  .day.all .badge { padding: 1px 2px; font-size: 9px; }
  .who-block { margin-top: 3px; gap: 1px; }
  .day.all .who { font-size: 10px; padding: 1px 1px; border-radius: 4px; line-height: 1.3; }
}

</style>
</head>

    const next = cloneState(state || freshState());
    next.nights = 0;
    next.baseOffPlaced = 0;
    next.weekendBaseOff = 0;
    next.weekdayBaseOff = 0;
    return next;
  }

  function applyShift(state, shift, isWeekendLike, isRequested) {
    if (shift === "OFF") {
      const startingRest =
        state.restOwed === 0 && (state.last === "N" || state.sameStreak >= 3);
      if (state.restOwed > 0) state.restOwed -= 1;
      else if (startingRest) state.restOwed = 1;
      if (!isRequested) {
        state.baseOffPlaced += 1;
        if (isWeekendLike) state.weekendBaseOff += 1;
        else state.weekdayBaseOff += 1;
      }
      state.workStreak = 0;
      state.sameStreak = 0;
      state.blockTypes = [];
      state.last = "OFF";
      return;
    }

    if (state.workStreak === 0) state.blockTypes = [shift];
    else if (state.blockTypes.indexOf(shift) === -1) state.blockTypes = state.blockTypes.concat(shift);
    state.workStreak += 1;
    state.sameStreak = state.last === shift ? state.sameStreak + 1 : 1;
    state.last = shift;
    if (shift === "N") state.nights += 1;
    if (state.sameStreak >= 3) state.restOwed = 2;
  }

  function canAssign(state, shift) {
    if (shift === "OFF") return true;
    if (state.restOwed > 0) return false;
    if (state.last === "E" && shift === "D") return false;
    if (state.last === "N" && shift !== "N") return false;
    if (shift === "N" && state.nights >= 6) return false;
    if (state.workStreak >= 5) return false;
    if (state.last === shift && state.sameStreak >= 3) return false;
    const types = state.workStreak === 0 ? [] : state.blockTypes;
    if (types.indexOf(shift) === -1 && types.length >= 2) return false;
    return true;
  }

  function blockReason(state, shift) {
    if (state.restOwed > 0) return "쉬어야 하는 날인데 근무가 들어갔습니다";
    if (state.last === "E" && shift === "D") return "이브닝 다음 날에는 데이를 넣을 수 없습니다";
    if (state.last === "N" && shift !== "N") return "나이트 다음 날에는 데이·이브닝을 넣을 수 없습니다";
    if (shift === "N" && state.nights >= 6) return "이번 달 나이트가 6개를 넘습니다";
    if (state.workStreak >= 5) return "연속 근무가 5일을 넘습니다";
    if (state.last === shift && state.sameStreak >= 3) return "같은 근무를 3일 넘게 이었습니다";
    const types = state.workStreak === 0 ? [] : state.blockTypes;
    if (types.indexOf(shift) === -1 && types.length >= 2) {
      return "오프와 오프 사이에 데이·이브닝·나이트가 모두 들어갔습니다";
    }
    return "근무 규칙을 벗어났습니다";
  }

  function budgetAllows(state, shift, baseOffTarget, daysAfter) {
    const completesTriple = state.last === shift && state.sameStreak >= 2;
    const startsNight = shift === "N" && state.last !== "N";
    if (!completesTriple && !startsNight) return true;
    const need = Math.min(2, daysAfter);
    return baseOffTarget - state.baseOffPlaced >= need;
  }

  function carryState(chain, staffId) {
    let state = freshState();
    chain.forEach(function (month) {
      const shifts = month.grid && month.grid[staffId];
      if (!shifts) {
        state = freshState();
        return;
      }
      for (let i = 0; i < shifts.length; i++) {
        applyShift(state, shifts[i], !!(month.weekendLike && month.weekendLike[i]), false);
      }
    });
    return beginMonth(state);
  }

  function historyStats(chain, staffId) {
    const stats = { weekendOffs: 0, weekdayOffs: 0, nights: 0, weekendWorks: 0, weekdayWorks: 0 };
    chain.slice(-11).forEach(function (month) {
      const shifts = month.grid && month.grid[staffId];
      if (!shifts) return;
      for (let i = 0; i < shifts.length; i++) {
        const weekend = !!(month.weekendLike && month.weekendLike[i]);
        if (shifts[i] === "OFF") {
          if (weekend) stats.weekendOffs += 1;
          else stats.weekdayOffs += 1;
        } else if (weekend) {
          stats.weekendWorks += 1;
          if (shifts[i] === "N") stats.nights += 1;
        } else {
          stats.weekdayWorks += 1;
          if (shifts[i] === "N") stats.nights += 1;
        }
      }
    });
    return stats;
  }

  function flexRemaining(requestSet, day, days) {
    let count = 0;
    for (let d = day; d < days; d++) if (!requestSet.has(d)) count += 1;
    return count;
  }

  function planTargets(input) {
    const weekendLike = input.weekendLike;
    const days = weekendLike.length;
    const staffCount = input.staffCount;
    const weDays = weekendLike.filter(Boolean).length;
    const wdDays = days - weDays;
    const baseOffTarget = input.baseOffTarget;
    const avg = days ? (staffCount * (days - baseOffTarget)) / days : 0;
    let wd;
    let we;
    const custom = input.weekdayTarget > 0 && input.weekendTarget > 0;
    if (custom) {
      wd = input.weekdayTarget;
      we = input.weekendTarget;
    } else {
      we = Math.round(avg * 0.75);
      wd = wdDays ? Math.round((avg * days - we * weDays) / wdDays) : we;
    }
    wd = clamp(Math.round(wd), 1, Math.max(1, staffCount));
    we = clamp(Math.round(we), 1, Math.max(1, staffCount));
    if (!custom && wd <= we && staffCount > 1) {
      if (wd < staffCount) wd += 1;
      if (wd <= we) we = Math.max(1, wd - 1);
    }
    const maxN = Math.max(1, Math.floor((6 * Math.max(1, staffCount)) / Math.max(1, days)));
    const perDay = weekendLike.map(function (isWeekend) {
      return splitTarget(isWeekend ? we : wd, maxN, staffCount);
    });
    return { weekdayTotal: wd, weekendTotal: we, maxN: maxN, perDay: perDay, average: avg };
  }

  function splitTarget(total, maxN, staffCount) {
    total = clamp(total, 0, staffCount);
    if (total <= 0) return { D: 0, E: 0, N: 0, total: 0 };
    if (total === 1) return { D: 1, E: 0, N: 0, total: 1 };
    if (total === 2) return { D: 1, E: 0, N: 1, total: 2 };
    let nights = clamp(Math.round(total * 0.28), 1, Math.min(maxN, total - 2));
    const rest = total - nights;
    const day = Math.ceil(rest / 2);
    const evening = rest - day;
    return { D: day, E: evening, N: nights, total: total };
  }

  function offPlanForPerson(baseOffTarget, requestSet, weekendLike, history, avgWeekendOffs) {
    let maxWeekend = 0;
    let maxWeekday = 0;
    for (let i = 0; i < weekendLike.length; i++) {
      if (requestSet.has(i)) continue;
      if (weekendLike[i]) maxWeekend += 1;
      else maxWeekday += 1;
    }
    let targetWeekend = Math.round(baseOffTarget * 0.5);
    const pastWeekend = history ? history.weekendOffs : 0;
    if (avgWeekendOffs > 0 || pastWeekend > 0) {
      if (pastWeekend > avgWeekendOffs + 1) targetWeekend -= 1;
      if (pastWeekend < avgWeekendOffs - 1) targetWeekend += 1;
    }
    targetWeekend = clamp(targetWeekend, 0, Math.min(baseOffTarget, maxWeekend));
    let targetWeekday = baseOffTarget - targetWeekend;
    if (targetWeekday > maxWeekday) {
      const spill = targetWeekday - maxWeekday;
      targetWeekday = maxWeekday;
      targetWeekend = Math.min(maxWeekend, targetWeekend + spill);
    }
    return { targetWeekend: targetWeekend, targetWeekday: baseOffTarget - targetWeekend };
  }

  function legalShifts(state, baseOffTarget, daysAfter) {
    return SHIFTS.filter(function (shift) {
      return canAssign(state, shift) && budgetAllows(state, shift, baseOffTarget, daysAfter);
    });
  }

  function scoreShift(state, shift, person, ctx) {
    let score = ctx.rng() * 2;
    if (state.last === shift && state.sameStreak < 3) score += shift === "N" ? 28 : 6;
    if (state.workStreak >= 4) score -= 6;
    if (shift === "N") {
      score -= state.nights * 6;
      score -= (person.histNights || 0) * 0.8;
      if (state.workStreak === 0) score += 3;
      else if (state.last !== "N") score -= 2;
      if ((person.histNights || 0) > ctx.avgHistNights + 1) score -= 3;
      if (state.last !== "N" && state.nights >= 3 && ctx.dayProgress < 0.75) score -= 18;
    }
    if (person.role === "선임" || person.role === "5년차") {
      const onShift = ctx.roleOnShift(shift, person.role);
      const onDay = ctx.roleOnDay(person.role);
      if (!onDay) score += 4;
      else if (!onShift) score += 2;
    }
    return score;
  }

  function workDesire(state, person, day, days, weekendLike, requestSet, rng) {
    const baseStill = person.baseOffTarget - state.baseOffPlaced;
    const flex = flexRemaining(requestSet, day, days);
    const offFrac = flex ? baseStill / flex : 0;
    let score = 2 - offFrac * 5 + rng() * 2;
    if (weekendLike[day]) {
      if (state.weekendBaseOff < person.targetWeekend) score -= 7;
      else score += 5;
    } else if (state.weekdayBaseOff < person.targetWeekday) score -= 3;
    else score += 4;
    if (person.role === "선임" || person.role === "5년차") score += 1;
    if (state.last === "N" && state.sameStreak < 3 && state.nights < 6) score += 8;
    else if ((state.last === "D" || state.last === "E") && state.sameStreak > 0 && state.sameStreak < 3 && state.workStreak < 4) {
      score += 2;
    }
    if (state.workStreak >= 4 && !(state.last === "N" && state.sameStreak < 3)) score -= 7;
    if (state.workStreak >= 3 && state.last !== "N") score -= 2;
    return score;
  }

  function buildOnce(input, rng) {
    const staff = input.staff;
    const days = input.weekendLike.length;
    const baseOffTarget = input.baseOffTarget;
    const targets = input.dayTargets;
    const states = staff.map(function (person) {
      return beginMonth(input.carry[person.id] || freshState());
    });
    const requestSets = staff.map(function (person) {
      return new Set((input.requests[person.id] || []).filter(function (day) {
        return day >= 0 && day < days;
      }));
    });
    const grid = staff.map(function () {
      return new Array(days);
    });

    for (let day = 0; day < days; day++) {
      const daysAfter = days - day - 1;
      const assignment = new Array(staff.length).fill(null);
      const reason = new Array(staff.length).fill("");
      const target = targets[day];

      for (let i = 0; i < staff.length; i++) {
        const requestSet = requestSets[i];
        if (requestSet.has(day)) {
          assignment[i] = "OFF";
          reason[i] = "request";
          continue;
        }
        if (states[i].restOwed > 0) {
          assignment[i] = "OFF";
          reason[i] = "rest";
          continue;
        }
        const baseStill = baseOffTarget - states[i].baseOffPlaced;
        const flex = flexRemaining(requestSet, day, days);
        if (baseStill >= flex) reason[i] = "budget-pending";
      }

      ["선임", "5년차"].forEach(function (role) {
        const pending = [];
        for (let i = 0; i < staff.length; i++) {
          if (staff[i].role === role && reason[i] === "budget-pending") pending.push(i);
        }
        if (!pending.length) return;
        const alreadyCovered = staff.some(function (person, index) {
          return person.role === role && reason[index] !== "budget-pending" && assignment[index] !== "OFF";
        });
        if (!alreadyCovered && pending.length >= 1) {
          const keeper = pending[day % pending.length];
          reason[keeper] = "";
        }
      });
      for (let i = 0; i < staff.length; i++) {
        if (reason[i] === "budget-pending") {
          assignment[i] = "OFF";
          reason[i] = "budget";
        }
      }

      ["선임", "5년차"].forEach(function (role) {
        const open = [];
        for (let i = 0; i < staff.length; i++) {
          if (staff[i].role !== role || assignment[i] !== null) continue;
          if (states[i].last === "N") continue;
          if (states[i].sameStreak >= 2 && states[i].last !== "OFF") continue;
          open.push(i);
        }
        if (open.length < 2) return;
        const weekend = input.weekendLike[day];
        open.sort(function (a, b) {
          const needA = weekend
            ? staff[a].targetWeekend - states[a].weekendBaseOff
            : staff[a].targetWeekday - states[a].weekdayBaseOff;
          const needB = weekend
            ? staff[b].targetWeekend - states[b].weekendBaseOff
            : staff[b].targetWeekday - states[b].weekdayBaseOff;
          if (needB !== needA) return needB - needA;
          return (a + day) % 2 - ((b + day) % 2);
        });
        const pickIndex = open[0];
        const need = weekend
          ? staff[pickIndex].targetWeekend - states[pickIndex].weekendBaseOff
          : staff[pickIndex].targetWeekday - states[pickIndex].weekdayBaseOff;
        if (need > 0 && baseOffTarget - states[pickIndex].baseOffPlaced > 0) {
          assignment[pickIndex] = "OFF";
          reason[pickIndex] = "stagger";
        }
      });

      function unassigned() {
        const list = [];
        for (let i = 0; i < staff.length; i++) if (assignment[i] === null) list.push(i);
        return list;
      }

      function mateCanCover(role, self, ahead) {
        const future = day + ahead;
        if (future >= days) return true;
        let mates = 0;
        let free = 0;
        for (let j = 0; j < staff.length; j++) {
          if (j === self || staff[j].role !== role) continue;
          mates += 1;
          if (requestSets[j].has(future)) continue;
          if (ahead < states[j].restOwed) continue;
          if (states[j].last === "N" && states[j].restOwed === 0) continue;
          if (assignment[j] === "N") continue;
          if (
            assignment[j] &&
            assignment[j] !== "OFF" &&
            states[j].last === assignment[j] &&
            states[j].sameStreak === 2 &&
            ahead >= 1 &&
            ahead <= 2
          ) {
            continue;
          }
          free += 1;
        }
        return mates === 0 || free > 0;
      }

      function keepsRoleCover(i, shift) {
        const role = staff[i].role;
        if (role !== "선임" && role !== "5년차") return true;
        const startsNight = shift === "N" && states[i].last !== "N";
        const completesDayOrEvening = shift !== "N" && states[i].last === shift && states[i].sameStreak === 2;
        if (startsNight) {
          return mateCanCover(role, i, 1) && mateCanCover(role, i, 2) && mateCanCover(role, i, 3) && mateCanCover(role, i, 4);
        }
        if (!completesDayOrEvening) return true;
        return mateCanCover(role, i, 1) && mateCanCover(role, i, 2);
      }

      function tripleRoom(i, shift) {
        if (shift === "N") return true;
        if (!(states[i].last === shift && states[i].sameStreak === 2)) return true;
        let finishing = 0;
        for (let j = 0; j < staff.length; j++) {
          if (
            assignment[j] &&
            assignment[j] !== "OFF" &&
            assignment[j] !== "N" &&
            states[j].last === assignment[j] &&
            states[j].sameStreak === 2
          ) {
            finishing += 1;
          }
        }
        return finishing < Math.max(2, Math.floor(staff.length / 5));
      }

      function canTake(i, shift) {
        return (
          canAssign(states[i], shift) &&
          budgetAllows(states[i], shift, baseOffTarget, daysAfter) &&
          keepsRoleCover(i, shift) &&
          tripleRoom(i, shift)
        );
      }

      function roleOnShift(shift, role) {
        for (let i = 0; i < staff.length; i++) {
          if (assignment[i] === shift && staff[i].role === role) return true;
        }
        return false;
      }

      function roleOnDay(role) {
        for (let i = 0; i < staff.length; i++) {
          if (assignment[i] && assignment[i] !== "OFF" && staff[i].role === role) return true;
        }
        return false;
      }

      function pick(shift, count, pool) {
        const candidates = pool.filter(function (i) {
          return assignment[i] === null && canTake(i, shift);
        });
        candidates.sort(function (a, b) {
          const ctx = { rng: rng, avgHistNights: input.avgHistNights, dayProgress: day / days, roleOnShift: roleOnShift, roleOnDay: roleOnDay };
          return scoreShift(states[b], shift, staff[b], ctx) - scoreShift(states[a], shift, staff[a], ctx);
        });
        const chosen = candidates.slice(0, count);
        chosen.forEach(function (i) {
          assignment[i] = shift;
          reason[i] = "work";
        });
        return chosen.length;
      }

      const continueNight = unassigned().filter(function (i) {
        return states[i].last === "N" && canTake(i, "N");
      });
      pick("N", continueNight.length, continueNight);
      const nightNow = assignment.filter(function (shift) { return shift === "N"; }).length;
      if (nightNow < target.N) pick("N", target.N - nightNow, unassigned());
      pick("E", target.E, unassigned());
      pick("D", target.D, unassigned());

      unassigned()
        .filter(function (i) {
          return baseOffTarget - states[i].baseOffPlaced <= 0;
        })
        .sort(function (a, b) {
          return workDesire(states[b], staff[b], day, days, input.weekendLike, requestSets[b], rng) -
            workDesire(states[a], staff[a], day, days, input.weekendLike, requestSets[a], rng);
        })
        .forEach(function (i) {
          const options = legalShifts(states[i], baseOffTarget, daysAfter);
          if (!options.length) {
            assignment[i] = "OFF";
            reason[i] = "overflow";
            return;
          }
          options.sort(function (a, b) {
            const ctx = { rng: rng, avgHistNights: input.avgHistNights, dayProgress: day / days, roleOnShift: roleOnShift, roleOnDay: roleOnDay };
            const countBias = function (shift) {
              const count = assignment.filter(function (value) { return value === shift; }).length;
              const goal = target[shift] || 0;
              return count < goal ? 6 : -count;
            };
            return scoreShift(states[i], b, staff[i], ctx) + countBias(b) - (scoreShift(states[i], a, staff[i], ctx) + countBias(a));
          });
          assignment[i] = options[0];
          reason[i] = "work";
        });

      function countShift(shift) {
        return assignment.filter(function (value) { return value === shift; }).length;
      }

      SHIFTS.forEach(function (short) {
        let guard = 0;
        while (countShift(short) < target[short] && guard < staff.length) {
          guard += 1;
          const idle = unassigned().filter(function (i) { return canTake(i, short); });
          if (idle.length) {
            idle.sort(function (a, b) {
              return workDesire(states[b], staff[b], day, days, input.weekendLike, requestSets[b], rng) -
                workDesire(states[a], staff[a], day, days, input.weekendLike, requestSets[a], rng);
            });
            assignment[idle[0]] = short;
            reason[idle[0]] = "work";
            continue;
          }
          let moved = false;
          for (let s = 0; s < SHIFTS.length && !moved; s++) {
            const extra = SHIFTS[s];
            if (extra === short || countShift(extra) <= 1) continue;
            const donors = [];
            for (let i = 0; i < staff.length; i++) if (assignment[i] === extra && canTake(i, short)) donors.push(i);
            if (!donors.length) continue;
            donors.sort(function (a, b) {
              const ctx = { rng: rng, avgHistNights: input.avgHistNights, dayProgress: day / days, roleOnShift: roleOnShift, roleOnDay: roleOnDay };
              return scoreShift(states[b], short, staff[b], ctx) - scoreShift(states[a], short, staff[a], ctx);
            });
            const donor = donors[0];
            const replacement = unassigned().find(function (i) { return canTake(i, extra); });
            assignment[donor] = short;
            if (replacement !== undefined) {
              assignment[replacement] = extra;
              reason[replacement] = "work";
            }
            moved = true;
          }
          if (!moved) break;
        }
      });

      const minWanted = Math.min(5, staff.length, staff.length - reason.filter(function (value) {
        return value === "request" || value === "rest" || value === "budget";
      }).length);
      let guardPull = 0;
      while (countShift("D") + countShift("E") + countShift("N") < Math.max(target.total, minWanted) && guardPull < staff.length) {
        guardPull += 1;
        const idle = unassigned().filter(function (i) { return legalShifts(states[i], baseOffTarget, daysAfter).length; });
        if (!idle.length) break;
        idle.sort(function (a, b) {
          return workDesire(states[b], staff[b], day, days, input.weekendLike, requestSets[b], rng) -
            workDesire(states[a], staff[a], day, days, input.weekendLike, requestSets[a], rng);
        });
        const i = idle[0];
        const options = legalShifts(states[i], baseOffTarget, daysAfter).slice().sort(function (a, b) {
          return countShift(a) - countShift(b);
        });
        assignment[i] = options[0];
        reason[i] = "work";
      }

      for (let i = 0; i < staff.length; i++) {
        if (assignment[i] === null) {
          assignment[i] = "OFF";
          reason[i] = "choice";
        }
      }

      ["선임", "5년차"].forEach(function (role) {
        if (!staff.some(function (person) { return person.role === role; })) return;
        if (roleOnDay(role)) {
          spreadRole(role);
          return;
        }
        const candidates = [];
        for (let i = 0; i < staff.length; i++) {
          if (staff[i].role !== role || reason[i] !== "choice") continue;
          if (!legalShifts(states[i], baseOffTarget, daysAfter).length) continue;
          candidates.push(i);
        }
        if (!candidates.length) return;
        const candidate = candidates[0];
        let victim = -1;
        const options = legalShifts(states[candidate], baseOffTarget, daysAfter);
        for (let i = 0; i < staff.length; i++) {
          if (reason[i] !== "work") continue;
          if (staff[i].role === "선임" || staff[i].role === "5년차") continue;
          if (baseOffTarget - states[i].baseOffPlaced <= 0) continue;
          if (options.indexOf(assignment[i]) === -1) continue;
          victim = i;
          break;
        }
        if (victim >= 0) {
          assignment[candidate] = assignment[victim];
          reason[candidate] = "work";
          assignment[victim] = "OFF";
          reason[victim] = "choice";
        } else {
          options.sort(function (a, b) { return countShift(a) - countShift(b); });
          assignment[candidate] = options[0];
          reason[candidate] = "work";
        }
        spreadRole(role);
      });

      function spreadRole(role) {
        SHIFTS.forEach(function (shift) {
          if (countShift(shift) === 0 || roleOnShift(shift, role)) return;
          const donors = [];
          SHIFTS.forEach(function (from) {
            if (from === shift) return;
            let roleCount = 0;
            for (let i = 0; i < staff.length; i++) if (assignment[i] === from && staff[i].role === role) roleCount += 1;
            if (roleCount < 2) return;
            for (let i = 0; i < staff.length; i++) {
              if (assignment[i] === from && staff[i].role === role && canTake(i, shift)) donors.push(i);
            }
          });
          if (!donors.length) return;
          const mover = donors[0];
          const partners = [];
          for (let i = 0; i < staff.length; i++) {
            if (assignment[i] === shift && staff[i].role !== role && canTake(i, assignment[mover])) partners.push(i);
          }
          if (!partners.length) return;
          const partner = partners[0];
          const moverShift = assignment[mover];
          assignment[mover] = shift;
          assignment[partner] = moverShift;
        });
      }

      for (let i = 0; i < staff.length; i++) {
        grid[i][day] = assignment[i];
        applyShift(states[i], assignment[i], input.weekendLike[day], requestSets[i].has(day));
      }
    }

    const byId = {};
    staff.forEach(function (person, index) {
      byId[person.id] = grid[index].slice();
    });
    return byId;
  }

  function dateLabel(dayIndex) {
    return dayIndex + 1 + "일";
  }

  function assess(input, grid) {
    const staff = input.staff;
    const days = input.weekendLike.length;
    const hard = [];
    const soft = [];
    const dayStats = [];
    const peopleStats = [];
    let penalty = 0;

    for (let day = 0; day < days; day++) {
      const bucket = { D: 0, E: 0, N: 0, OFF: 0, senior: 0, year5: 0 };
      staff.forEach(function (person) {
        const shift = grid[person.id][day];
        bucket[shift] += 1;
        if (shift !== "OFF" && person.role === "선임") bucket.senior += 1;
        if (shift !== "OFF" && person.role === "5년차") bucket.year5 += 1;
      });
      const working = bucket.D + bucket.E + bucket.N;
      dayStats.push({
        working: working,
        D: bucket.D,
        E: bucket.E,
        N: bucket.N,
        off: bucket.OFF,
        senior: bucket.senior,
        year5: bucket.year5,
      });
      if (staff.length >= 5 && working < 5) {
        soft.push(dateLabel(day) + " 근무 인원이 " + working + "명입니다. 하루 5명 이상이 필요합니다.");
        penalty += 80;
      }
      if (staff.some(function (person) { return person.role === "선임"; }) && bucket.senior === 0) {
        soft.push(dateLabel(day) + " 근무하는 선임이 없습니다.");
        penalty += 70;
      }
      if (staff.some(function (person) { return person.role === "5년차"; }) && bucket.year5 === 0) {
        soft.push(dateLabel(day) + " 근무하는 5년차가 없습니다.");
        penalty += 70;
      }
      if (staff.length >= 8) {
        SHIFTS.forEach(function (shift) {
          const goal = input.dayTargets[day][shift];
          if (goal > 0 && bucket[shift] === 0) {
            const label = shift === "D" ? "데이" : shift === "E" ? "이브닝" : "나이트";
            soft.push(dateLabel(day) + " " + label + " 근무가 비어 있습니다.");
            penalty += 25;
          }
        });
      }
    }

    let weekdayWork = 0;
    let weekdayDays = 0;
    let weekendWork = 0;
    let weekendDays = 0;
    input.weekendLike.forEach(function (isWeekend, day) {
      if (isWeekend) {
        weekendWork += dayStats[day].working;
        weekendDays += 1;
      } else {
        weekdayWork += dayStats[day].working;
        weekdayDays += 1;
      }
    });
    const weekdayAvg = weekdayDays ? weekdayWork / weekdayDays : 0;
    const weekendAvg = weekendDays ? weekendWork / weekendDays : 0;
    if (weekdayDays && weekendDays && weekdayAvg <= weekendAvg) {
      soft.push(
        "평일 평균 " + weekdayAvg.toFixed(1) + "명, 주말·공휴일 평균 " +
          weekendAvg.toFixed(1) + "명입니다. 평일 인원이 더 많아야 합니다."
      );
      penalty += 100;
    }

    staff.forEach(function (person) {
      const shifts = grid[person.id];
      const requestSet = new Set(input.requests[person.id] || []);
      const state = beginMonth(input.carry[person.id] || freshState());
      for (let day = 0; day < days; day++) {
        const shift = shifts[day];
        const requested = requestSet.has(day);
        if (requested && shift !== "OFF") {
          hard.push(person.name + " 님 " + dateLabel(day) + " 신청 오프가 반영되지 않았습니다.");
          penalty += 10000;
        } else if (shift !== "OFF" && !canAssign(state, shift)) {
          hard.push(person.name + " 님 " + dateLabel(day) + " " + blockReason(state, shift) + ".");
          penalty += 10000;
        }
        applyShift(state, shift, input.weekendLike[day], requested);
      }
      const requestCount = requestSet.size;
      peopleStats.push({
        id: person.id,
        name: person.name,
        role: person.role,
        nights: state.nights,
        baseOff: state.baseOffPlaced,
        weekendOff: state.weekendBaseOff,
        weekdayOff: state.weekdayBaseOff,
        requestOff: requestCount,
        totalOff: state.baseOffPlaced + requestCount,
        targetWeekend: person.targetWeekend,
        targetWeekday: person.targetWeekday,
      });
      const offDiff = Math.abs(state.baseOffPlaced - input.baseOffTarget);
      if (offDiff) {
        soft.push(
          person.name + " 님 기본 오프가 " + state.baseOffPlaced + "일입니다. 목표는 " + input.baseOffTarget + "일입니다."
        );
        penalty += offDiff * 40;
      }
      const weekendDiff = Math.abs(state.weekendBaseOff - person.targetWeekend);
      if (weekendDiff >= 3) {
        soft.push(
          person.name + " 님 주말·공휴일 오프가 " + state.weekendBaseOff + "일, 평일 오프가 " +
            state.weekdayBaseOff + "일입니다."
        );
        penalty += weekendDiff * 12;
      }
    });

    const nightCounts = peopleStats.map(function (person) { return person.nights; }).sort(function (a, b) { return a - b; });
    const mid = nightCounts.length ? nightCounts[Math.floor(nightCounts.length / 2)] : 0;
    peopleStats.forEach(function (person) {
      penalty += Math.abs(person.nights - mid) * 4;
      if (person.nights > 6) {
        hard.push(person.name + " 님 나이트가 6개를 넘습니다.");
        penalty += 10000;
      }
    });

    return {
      hard: hard,
      soft: soft,
      penalty: penalty,
      stats: {
        weekdayAvg: weekdayAvg,
        weekendAvg: weekendAvg,
        baseOffTarget: input.baseOffTarget,
        days: dayStats,
        people: peopleStats,
      },
    };
  }

  function preparePeople(input) {
    const days = input.weekendLike.length;
    const baseOffTarget = input.weekendLike.filter(Boolean).length;
    const histories = input.staff.map(function (person) {
      return (input.history && input.history[person.id]) || historyStats(input.chain || [], person.id);
    });
    const tracked = histories.filter(function (item) { return item.weekendOffs + item.weekdayOffs > 0; });
    const avgWeekend =
      tracked.reduce(function (sum, item) { return sum + item.weekendOffs; }, 0) / (tracked.length || 1);
    const avgNights =
      histories.reduce(function (sum, item) { return sum + item.nights; }, 0) / (histories.length || 1);
    const staff = input.staff.map(function (person, index) {
      const requestSet = new Set(input.requests[person.id] || []);
      const plan = offPlanForPerson(baseOffTarget, requestSet, input.weekendLike, histories[index], tracked.length ? avgWeekend : 0);
      return {
        id: person.id,
        name: person.name,
        role: person.role,
        baseOffTarget: baseOffTarget,
        targetWeekend: plan.targetWeekend,
        targetWeekday: plan.targetWeekday,
        histNights: histories[index].nights,
        rolePool: input.staff.filter(function (other) { return other.role === person.role; }).length,
        roleUsedGuess: 0,
      };
    });
    const targets = planTargets({
      staffCount: staff.length,
      weekendLike: input.weekendLike,
      baseOffTarget: baseOffTarget,
      weekdayTarget: input.weekdayTarget,
      weekendTarget: input.weekendTarget,
    });
    return {
      staff: staff,
      baseOffTarget: baseOffTarget,
      avgHistNights: avgNights,
      dayTargets: targets.perDay,
      targetSummary: targets,
      days: days,
    };
  }

  function generateRoster(input) {
    if (!input.staff.length) {
      return { grid: {}, hard: [], soft: ["근무자를 먼저 추가해 주세요."], penalty: 0, stats: null };
    }
    const prepared = preparePeople(input);
    const merged = {
      staff: prepared.staff,
      weekendLike: input.weekendLike,
      requests: input.requests || {},
      carry: input.carry || {},
      baseOffTarget: prepared.baseOffTarget,
      dayTargets: prepared.dayTargets,
      avgHistNights: prepared.avgHistNights,
    };
    const restarts = input.restarts || (input.staff.length > 200 ? 6 : input.staff.length > 80 ? 10 : 16);
    let best = null;
    const seed = input.seed || 20261025;
    for (let restart = 0; restart < restarts; restart++) {
      const grid = buildOnce(merged, mulberry32(seed + restart * 9973));
      const report = assess(merged, grid);
      if (!best || report.penalty < best.penalty) {
        best = {
          grid: grid,
          hard: report.hard,
          soft: report.soft,
          penalty: report.penalty,
          stats: report.stats,
          targets: prepared.targetSummary,
        };
      }
    }
    return best;
  }

  function validateGrid(input, grid) {
    const prepared = preparePeople(input);
    const merged = {
      staff: prepared.staff,
      weekendLike: input.weekendLike,
      requests: input.requests || {},
      carry: input.carry || {},
      baseOffTarget: prepared.baseOffTarget,
      dayTargets: prepared.dayTargets,
      avgHistNights: prepared.avgHistNights,
    };
    const report = assess(merged, grid);
    report.targets = prepared.targetSummary;
    return report;
  }

  return {
    SHIFTS: SHIFTS,
    freshState: freshState,
    cloneState: cloneState,
    beginMonth: beginMonth,
    applyShift: applyShift,
    canAssign: canAssign,
    carryState: carryState,
    historyStats: historyStats,
    planTargets: planTargets,
    generateRoster: generateRoster,
    validateGrid: validateGrid,
  };
});

    const buckets = { D: [], E: [], N: [], OFF: [] };
    staff.forEach(function (person) {
      const row = (gridById && gridById[person.id]) || [];
      const shift = row[index] || "OFF";
      const code = shift === "D" || shift === "E" || shift === "N" ? shift : "OFF";
      const requested = ((requestsById && requestsById[person.id]) || []).indexOf(day.iso) >= 0 && code === "OFF";
      const act = ' data-id="' + person.id + '"' + (nameAct ? ' data-act="' + nameAct + '"' : "");
      buckets[code].push('<button type="button" class="who ' + (requested ? "REQ" : code) + '"' + act + ">" + esc(person.name) + "</button>");
    });
    return ["D", "E", "N", "OFF"].map(function (code) {
      if (!buckets[code].length) return "";
      return '<div class="who-block"><span class="badge ' + code + '">' + (code === "OFF" ? "오프" : code) + "</span>" + buckets[code].join("") + "</div>";
    }).join("");
  }

  function renderSettings(days) {
    const base = days.filter(function (day) { return day.weekend; }).length;
    const prefix = currentKey();
    const active = holidayMap(app.year);
    const rows = [];
    Object.keys(HOLIDAYS).forEach(function (iso) {
      if (iso.indexOf(prefix) === 0) rows.push({ iso: iso, name: HOLIDAYS[iso], on: !!active[iso], extra: false });
    });
    app.extraHolidays.forEach(function (item) {
      if (item.date && item.date.indexOf(prefix) === 0) rows.push({ iso: item.date, name: item.name || "휴무", on: true, extra: true });
    });
    rows.sort(function (a, b) { return a.iso < b.iso ? -1 : 1; });
    const prev = app.month === 1 ? monthKey(app.year - 1, 12) : monthKey(app.year, app.month - 1);
    return '<section class="card"><h2>만드는 순서</h2><p class="help">인원을 넣고, 오프를 먼저 신청한 뒤 근무표를 만듭니다. 만든 표는 이 브라우저에 자동으로 저장되고, 다음 달은 지난달 마지막 근무를 이어서 계산합니다.</p>' +
      '<div class="field"><span>병동 이름</span><input id="ward" type="text" maxlength="30" value="' + esc(app.wardName) + '" placeholder="예: 5병동"></div></section>' +
      '<section class="card"><h2>근무 시간</h2><p class="help">시간은 달력에 보여 주는 용도입니다. 이브닝 다음 날 데이 금지, 나이트 다음 날 데이·이브닝 금지는 시간 대신 이 규칙으로 지킵니다.</p>' +
      ["D", "E", "N"].map(function (code) {
        const shift = app.shifts[code];
        return '<div class="row" style="margin-bottom:8px"><strong style="width:64px">' + shiftName(code) + '</strong>' +
          '<input data-shift="' + code + '" data-part="start" type="time" value="' + esc(shift.start) + '">' +
          '<input data-shift="' + code + '" data-part="end" type="time" value="' + esc(shift.end) + '"></div>';
      }).join("") + "</section>" +
      '<section class="card"><h2>하루 인원 목표</h2><p class="help">비워 두면 인원과 오프 수에 맞춰 평일이 주말·공휴일보다 많게 잡습니다. 하루 합계가 5명보다 적으면 근무표에 부족으로 표시합니다. 선임 1명, 5년차 1명은 하루 전체에서 한 번씩 들어가게 맞춥니다.</p>' +
      '<div class="grid-2"><label class="field"><span>평일 목표 인원</span><input id="wdtarget" type="number" min="1" max="999" placeholder="자동" value="' + esc(app.weekdayTarget) + '"></label>' +
      '<label class="field"><span>주말·공휴일 목표 인원</span><input id="wetarget" type="number" min="1" max="999" placeholder="자동" value="' + esc(app.weekendTarget) + '"></label></div></section>' +
      '<section class="card"><h2>' + app.month + "월 쉬는 날 " + base + '일</h2><p class="help">기본 오프는 신청 오프를 빼고 이 날 수와 같습니다. 토·일·공휴일에만 몰지 않고, 평일과 주말이 사람마다 비슷하게 나뉩니다. 2025–2028년 공휴일을 넣어 두었습니다.</p>' +
      (app.schedules[prev] ? '<div class="ok">' + prev.slice(5) + "월 근무표가 있어 이번 달은 그 마지막 근무를 잇습니다.</div>" : '<div class="note">지난달 근무표가 없습니다. 이번 달은 1일부터 새로 계산합니다.</div>') +
      rows.map(function (row) {
        return '<div class="holi"><div style="flex:1"><b>' + row.iso.slice(8) + "일</b> " + esc(row.name) + "</div>" +
          (row.on
            ? '<button class="btn-tiny danger" type="button" data-act="hide-holiday" data-iso="' + row.iso + '" data-extra="' + (row.extra ? "1" : "0") + '">빼기</button>'
            : '<button class="btn-tiny" type="button" data-act="restore-holiday" data-iso="' + row.iso + '">다시 넣기</button>') +
          "</div>";
      }).join("") +
      '<div class="row" style="margin-top:10px"><input id="holidate" type="date"><input id="holiname" type="text" maxlength="20" placeholder="휴무 이름"><button class="btn" type="button" data-act="add-holiday">추가</button></div></section>' +
      '<section class="card"><button class="btn danger" type="button" data-act="reset">이 브라우저의 데이터 지우기</button></section>';
  }

  function renderStaff() {
    return '<section class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">근무자 ' + app.staff.length + '명</h2><button class="btn" type="button" data-act="add-staff">추가</button></div>' +
      '<p class="help">한 사람당 직책은 하나입니다. 1명부터 999명까지 넣을 수 있습니다.</p>' +
      (app.staff.length ? "" : '<button class="btn-ghost" type="button" data-act="sample">예시 12명 넣기</button>') +
      app.staff.map(function (person, index) {
        return '<div class="staff-item"><label class="field who"><span>이름</span><input data-staff="' + person.id + '" data-prop="name" type="text" maxlength="20" value="' + esc(person.name) + '"></label>' +
          '<label class="field"><span>직책</span><select data-staff="' + person.id + '" data-prop="role">' +

      "</section>";
  }

  function renderOff(days) {
    if (!app.staff.length) return '<section class="card"><h2>오프 신청</h2><p class="help">먼저 근무자를 추가해 주세요.</p></section>';
    const selected = app.staff.some(function (person) { return person.id === ui.focusId; }) ? ui.focusId : app.staff[0].id;
    const person = app.staff.find(function (item) { return item.id === selected; });
    const mine = requestsFor(selected);
    const base = weekendCount();
    return '<section class="card"><h2>오프 신청</h2><p class="help">' + app.month + "월 기본 오프는 " + base + "일입니다. " + esc(person.name) + " 님은 신청 " + mine.length + "일 외에 기본 오프 " + base + "일이 더 들어갑니다. 선임끼리, 5년차끼리는 같은 날 모두 오프가 되지 않게 나눠 주세요.</p>" +
      '<div class="chips">' + app.staff.map(function (item) {
        return '<button class="chip' + (item.id === selected ? " on" : "") + '" type="button" data-act="pick" data-id="' + item.id + '">' + esc(item.name) + " · " + esc(item.role) + "</button>";
      }).join("") + "</div>" +
      calendarHtml(days, function (day, isToday) {
        const on = mine.indexOf(day.iso) >= 0;
        const gap = roleRequestGap(day.iso);
        const cls = ["day", day.dow === 0 ? "sun" : "", day.dow === 6 ? "sat" : "", day.holiday ? "holi" : "", on ? "on" : "", isToday ? "today" : ""].join(" ");
        return '<button class="' + cls + '" type="button" data-act="toggle-off" data-id="' + selected + '" data-iso="' + day.iso + '"><span class="n">' + day.day + '</span>' +
          (on ? '<span class="badge REQ">신청</span>' : '<span class="badge OFF"> </span>') +
          "<small>" + esc(day.holiday || (gap.length ? "확인" : "")) + "</small></button>";
      }) +
      (mine.map(function (iso) { return roleRequestGap(iso).map(function (text) { return iso.slice(8) + "일 " + text; }).join(""); }).filter(Boolean).length
        ? '<div class="warn">같은 직책이 모두 쉰 날이 있습니다. 신청은 그대로 두고, 근무표에 인원 부족으로 표시합니다.<ul>' +
          mine.map(function (iso) {
            return roleRequestGap(iso).map(function (text) { return "<li>" + Number(iso.slice(8)) + "일 " + esc(text) + "</li>"; }).join("");
          }).join("") + "</ul></div>"
        : '<div class="ok">선택한 신청으로는 선임과 5년차가 같은 날 모두 빠지지 않습니다.</div>') +
      "</section>";
  }

  function personSummary(person, report, days) {
    if (!report || !report.stats) return "";
    const stat = report.stats.people.find(function (item) { return item.id === person.id; });
    if (!stat) return "";
    let reqWeekend = 0;
    let reqWeekday = 0;
    requestsFor(person.id).forEach(function (iso) {
      const day = days.find(function (item) { return item.iso === iso; });
      if (!day) return;
      if (day.weekend) reqWeekend += 1; else reqWeekday += 1;
    });
    return stat.nights + "나이트 · 오프 " + (stat.weekendOff + stat.weekdayOff + reqWeekend + reqWeekday) + "일 (주말·공휴일 " +
      (stat.weekendOff + reqWeekend) + " · 평일 " + (stat.weekdayOff + reqWeekday) + ")";
  }

  function renderRoster(days) {
    const key = currentKey();
    const report = currentReport();
    if (!app.schedules[key]) {
      return '<section class="card"><h2>근무표</h2><p class="help">오프 신청을 먼저 반영한 뒤 만듭니다.</p><button class="btn wide" type="button" data-act="generate">' + (ui.busy ? "만드는 중" : "근무표 만들기") + "</button></section>";
    }
    const focus = app.staff.some(function (person) { return person.id === ui.focusId; }) ? ui.focusId : app.staff[0].id;
    const person = app.staff.find(function (item) { return item.id === focus; });
    const hard = report ? report.hard : [];
    const soft = report ? report.soft : [];
    const shownSoft = ui.moreWarn ? soft : soft.slice(0, 8);
    let body = '<section class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">' + app.month + '월 근무표</h2><button class="btn" type="button" data-act="generate"' + (ui.busy ? " disabled" : "") + ">" + (ui.busy ? "만드는 중" : "다시 만들기") + "</button></div>";
    if (report && report.stats) {
      body += '<div class="stats" style="margin-top:12px"><div class="stat"><b>' + report.stats.weekdayAvg.toFixed(1) + '</b><span>평일 평균 인원</span></div><div class="stat"><b>' + report.stats.weekendAvg.toFixed(1) + '</b><span>주말·공휴일 평균</span></div><div class="stat"><b>' + report.stats.baseOffTarget + '</b><span>기본 오프</span></div></div>';
    }
    if (hard.length) body += '<div class="bad">규칙을 벗어난 칸이 있습니다.<ul>' + hard.slice(0, 12).map(function (text) { return "<li>" + esc(text) + "</li>"; }).join("") + "</ul></div>";
    else body += '<div class="ok">신청 오프, 나이트 개수, 연속 근무, 근무 순서는 지켰습니다.</div>';
    if (shownSoft.length) {
      body += '<div class="warn">인원이 부족한 날이 있으면 아래에 표시합니다. 신청 오프는 그대로 두었습니다.<ul>' + shownSoft.map(function (text) { return "<li>" + esc(text) + "</li>"; }).join("") + "</ul>" +
        (soft.length > 8 ? '<button class="btn-tiny" type="button" data-act="more-warn">' + (ui.moreWarn ? "접기" : "외 " + (soft.length - 8) + "건 더 보기") + "</button>" : "") + "</div>";
    }
    body += "</section>";
    body += '<section class="card"><div class="person-head"><h2 style="margin:0">' + (ui.showAll ? "전체 달력" : "개인 달력") + '</h2><button class="btn-tiny" type="button" data-act="toggle-all">' + (ui.showAll ? "개인 달력" : "전체 표") + "</button></div>" + legend() +
      '<div class="chips">' + app.staff.map(function (item) {
        return '<button class="chip' + (!ui.showAll && item.id === focus ? " on" : "") + '" type="button" data-act="focus" data-id="' + item.id + '">' + esc(item.name) + "</button>";
      }).join("") + "</div>";
    if (!ui.showAll && person) {
      const row = app.schedules[key][person.id] || [];
      body += '<div class="person-head"><div><strong>' + esc(person.name) + '</strong> <span class="role-tag">' + esc(person.role) + '</span><div class="sub">' + esc(personSummary(person, report, days)) + "</div></div></div>";
      body += calendarHtml(days, function (day, isToday) {
        const shift = row[day.day - 1] || "OFF";
        const requested = requestsFor(person.id).indexOf(day.iso) >= 0 && shift === "OFF";
        const cls = ["day", day.dow === 0 ? "sun" : "", day.dow === 6 ? "sat" : "", day.holiday ? "holi" : "", isToday ? "today" : ""].join(" ");
        return '<div class="' + cls + '"><span class="n">' + day.day + '</span><span class="badge ' + (requested ? "REQ" : shift) + '">' + mark(shift, requested) + "</span><small>" + esc(day.holiday) + "</small></div>";
      });
    }
    if (ui.showAll) {
      body += '<p class="help">각 날짜 안에 그날의 근무자 이름이 모두 들어갑니다. 이름을 누르면 그 사람 달력만 보입니다.</p>';
      body += '<div class="cal-scroll">' + calendarHtml(days, function (day, isToday) {
        const cls = ["day", "all", day.dow === 0 ? "sun" : "", day.dow === 6 ? "sat" : "", day.holiday ? "holi" : "", isToday ? "today" : ""].join(" ");
        return '<div class="' + cls + '"><div class="day-top"><span class="n">' + day.day + "</span>" +
          (day.holiday ? "<small>" + esc(day.holiday) + "</small>" : "") + "</div>" +
          namesForDay(app.staff, app.schedules[key], app.requests[key] || {}, day, day.day - 1, "focus") + "</div>";
      }, "all") + "</div>";
      body += '<button class="btn-tiny" type="button" data-act="edit-grid" style="margin-top:8px">' + (ui.editGrid ? "수정 표 접기" : "근무 칸 수정") + "</button>";
      let rows = app.staff.filter(function (item) {
        return !ui.query || item.name.indexOf(ui.query) >= 0 || item.role.indexOf(ui.query) >= 0;
      });
      const trimmed = rows.length > 20 && !ui.showEveryRow && !ui.query;
      if (trimmed) rows = rows.slice(0, 20);
      if (ui.editGrid) {
      body += '<div class="row" style="margin-top:8px"><input id="find" type="search" placeholder="이름 검색" value="' + esc(ui.query) + '"></div>';
      body += '<p class="help">칸을 누르면 오프 → 데이 → 이브닝 → 나이트 순서로 바뀝니다. 규칙은 바꾼 뒤에도 다시 확인합니다.</p>';
      body += '<div class="table-scroll"><table><thead><tr><th>이름</th>' + days.map(function (day) {
        const cls = day.iso === todayIso() ? "todayh" : day.dow === 0 || day.holiday ? "sunh" : day.dow === 6 ? "sath" : "";

      }).join("") + "</tr></thead><tbody>";
      rows.forEach(function (item) {

        days.forEach(function (day, index) {

          const text = requested ? "신" : shift === "OFF" ? "오" : shift;
          body += '<td class="' + cls + '"><button type="button" data-act="cycle" data-id="' + item.id + '" data-day="' + index + '">' + text + "</button></td>";
        });
        body += "</tr>";
      });
      body += "</tbody></table></div>";
      if (trimmed) body += '<button class="btn-ghost" type="button" data-act="every-row" style="margin-top:8px">전체 ' + app.staff.length + "명 펼치기</button>";
      }
    }
    body += "</section>" + renderFair();
    return body;
  }

  function renderFair() {
    const end = app.year * 12 + app.month - 1;
    const months = [];
    for (let back = 0; back < 12; back++) {
      const index = end - back;
      const year = Math.floor(index / 12);
      const month = (index % 12) + 1;
      const key = monthKey(year, month);
      if (app.schedules[key]) months.push({ year: year, month: month, key: key });
    }
    if (!months.length) return "";
    const lines = app.staff.map(function (person) {
      const stat = { weekendOffs: 0, weekdayOffs: 0, nights: 0 };
      months.forEach(function (item) {
        const grid = app.schedules[item.key][person.id];
        if (!grid) return;
        const days = buildDays(item.year, item.month);
        grid.forEach(function (shift, index) {
          const weekend = days[index] && days[index].weekend;
          if (shift === "OFF") { if (weekend) stat.weekendOffs += 1; else stat.weekdayOffs += 1; }
          else if (shift === "N") stat.nights += 1;
        });
      });
      return "<tr><td>" + esc(person.name) + "</td><td>" + stat.weekendOffs + "</td><td>" + stat.weekdayOffs + "</td><td>" + stat.nights + "</td></tr>";
    }).join("");
    return '<section class="card"><h2>최근 ' + months.length + '개월 분포</h2><p class="help">달을 이어서 만들수록 주말 오프와 평일 오프, 나이트가 사람들 사이에 비슷해집니다.</p><div class="table-scroll"><table class="fair"><thead><tr><th>이름</th><th>주말 오프</th><th>평일 오프</th><th>나이트</th></tr></thead><tbody>' + lines + "</tbody></table></div></section>";
  }

    if (!app.schedules[currentKey()]) return '<section class="card"><h2>공유</h2><p class="help">근무표를 만든 뒤에 보낼 수 있습니다.</p></section>';

      return !ui.shareQuery || person.name.indexOf(ui.shareQuery) >= 0;
    });
    return '<section class="card"><h2>근무자에게 보내기</h2><p class="help">컴퓨터가 꺼진 뒤에도 보려면 파일을 카카오톡으로 휴대폰에 보내 저장하세요. 그 파일은 인터넷 없이 열립니다. 링크는 이 컴퓨터가 켜져 있을 때만 됩니다.</p>' +

      '<div class="field" style="margin-top:12px"><span>사람 찾기</span><input id="sharefind" type="search" value="' + esc(ui.shareQuery) + '" placeholder="이름"></div>' +
      people.map(function (person) {
        return '<div class="share-item"><div style="flex:1"><b>' + esc(person.name) + '</b><div class="sub">' + esc(person.role) + '</div></div>' +
          '<button class="btn-tiny" type="button" data-act="download-one" data-id="' + person.id + '">파일</button>' +
          '<button class="btn-tiny" type="button" data-act="copy-one" data-id="' + person.id + '">링크</button></div>';
      }).join("") +
      '<div class="row" style="margin-top:12px"><button class="btn-ghost" type="button" data-act="backup">백업 저장</button><button class="btn-ghost" type="button" data-act="pick-restore">백업 불러오기</button><input id="restore" class="hidden-file" type="file" accept="application/json,.json"></div></section>';
  }

  function renderEditor() {
    const days = buildDays(app.year, app.month);
    const now = new Date();

  async function packPayload(obj) {
    const bytes = new TextEncoder().encode(JSON.stringify(obj));
    if (typeof CompressionStream === "undefined") return "r." + bytesToB64(bytes);
    const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate"));
    const out = new Uint8Array(await new Response(stream).arrayBuffer());
    return "z." + bytesToB64(out);
  }
  async function unpackPayload(raw) {
    const kind = raw.slice(0, 2);
    const bytes = b64ToBytes(raw.slice(2));
    if (kind === "r.") return JSON.parse(new TextDecoder().decode(bytes));
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"));
    const out = new Uint8Array(await new Response(stream).arrayBuffer());
    return JSON.parse(new TextDecoder().decode(out));
  }
  function bytesToB64(bytes) {
    let bin = "";
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, Array.from(bytes.subarray(i, i + 0x8000)));
    }
    return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
  }
  function b64ToBytes(text) {
    const pad = (4 - (text.length % 4)) % 4;
    const bin = atob(text.replace(/-/g, "+").replace(/_/g, "/") + "====".slice(0, pad));
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
  function download(filename, text, type) {
    const blob = new Blob([text], { type: type });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function renderViewer(payload) {

          return '<button class="chip' + (person && item.id === person.id ? " on" : "") + '" type="button" data-view="' + esc(item.id) + '">' + esc(item.name) + "</button>";
        }).join("");
      let calendar = "";
      if (!person) {
        calendar = '<div class="cal-scroll">' + '<div class="cal all">' +
          DOW.map(function (name, index) { return '<div class="dow ' + (index === 0 ? "sun" : index === 6 ? "sat" : "") + '">' + name + "</div>"; }).join("") +
          new Array(payload.days[0].dow).fill('<div class="day out"></div>').join("") +
          payload.days.map(function (day, index) {

              namesForDay(payload.staff, payload.grid, payload.requests || {}, day, index, "") + "</div>";

          new Array(payload.days[0].dow).fill('<div class="day out"></div>').join("") +
          payload.days.map(function (day, index) {

      root.querySelectorAll("[data-view], .who").forEach(function (button) {
        button.onclick = function () {
          focus = button.getAttribute("data-view") || button.getAttribute("data-id") || "";
          draw();
        };
      });

    draw();

  function findStaff(id) { return app.staff.find(function (person) { return person.id === id; }); }
  function moveStaff(id, dir) {
    const index = app.staff.findIndex(function (person) { return person.id === id; });
    const next = index + dir;
    if (index < 0 || next < 0 || next >= app.staff.length) return;
    const item = app.staff.splice(index, 1)[0];
    app.staff.splice(next, 0, item);
  }

  async function generate() {
    if (!app.staff.length) { ui.flash = "근무자를 먼저 추가해 주세요."; ui.tab = "인원"; return; }
    if (app.staff.some(function (person) { return !person.name.trim(); })) { ui.flash = "이름이 비어 있는 근무자가 있습니다."; ui.tab = "인원"; return; }
    if (app.schedules[currentKey()] && !window.confirm("이번 달 근무표를 다시 만들까요? 손으로 고친 칸도 바뀝니다.")) return;
    ui.busy = true;
    renderEditor();
    try {
      await new Promise(function (resolve) { setTimeout(resolve, 40); });
      const days = buildDays(app.year, app.month);
      const linked = carryChain().length > 0;
      const result = window.RosterScheduler.generateRoster(schedulerInput(days));
      app.schedules[currentKey()] = result.grid;
      ui.focusId = app.staff[0].id;
      ui.showAll = window.matchMedia("(min-width: 900px)").matches;
      ui.tab = "근무표";
      ui.flash = linked ? "지난달 마지막 근무를 이어서 만들었습니다." : "지난달 근무표가 없어 1일부터 새로 만들었습니다.";
      save();
    } catch (err) {
      ui.flash = "근무표를 만들지 못했습니다. 인원과 오프 신청을 다시 확인해 주세요.";
    }
    ui.busy = false;
  }

  async function copyLink(focus) {
    const packed = await packPayload(viewPayload(focus));
    const url = location.href.split("#")[0] + "#v1." + packed + (focus ? "~" + focus : "");
    try {
      await navigator.clipboard.writeText(url);
      ui.flash = "링크를 복사했습니다.";
      ui.linkFallback = "";
    } catch (err) {
      ui.flash = "자동 복사가 막혀 있습니다. 아래 주소를 길게 눌러 복사해 주세요.";
      ui.linkFallback = url;
    }
  }

  function onClick(event) {
    const button = event.target.closest("[data-act]");
    if (!button) return;
    const act = button.dataset.act;
    const id = button.dataset.id;
    ui.flash = "";
    if (act === "tab") { ui.tab = button.dataset.tab; window.scrollTo(0, 0); }
    else if (act === "prev-month" || act === "next-month") {
      const delta = act === "next-month" ? 1 : -1;
      const index = app.year * 12 + app.month - 1 + delta;
      app.year = Math.floor(index / 12);
      app.month = (index % 12) + 1;
      save();
    } else if (act === "add-staff") {
      if (app.staff.length >= 999) { ui.flash = "근무자는 999명까지입니다."; }
      else app.staff.push({ id: uid(), name: "근무자" + (app.staff.length + 1), role: "신규" });
      save();
    } else if (act === "del-staff") {
      const person = findStaff(id);
      if (person && window.confirm(person.name + " 님을 목록에서 뺄까요?")) app.staff = app.staff.filter(function (item) { return item.id !== id; });
      save();
    } else if (act === "up") { moveStaff(id, -1); save(); }
    else if (act === "down") { moveStaff(id, 1); save(); }
    else if (act === "sample") {
      if (app.staff.length && !window.confirm("예시 인원으로 바꾸면 지금 인원과 이번 달 이후 표가 지워집니다. 바꿀까요?")) return;
      const sample = [["김하늘", "선임"], ["이서연", "선임"], ["박지민", "5년차"], ["최수아", "5년차"], ["정예린", "4년차"], ["한도윤", "4년차"], ["오채원", "3년차"], ["윤시우", "3년차"], ["서지호", "2년차"], ["배민서", "2년차"], ["문하준", "1년차"], ["신유나", "신규"]];
      app.staff = sample.map(function (item) { return { id: uid(), name: item[0], role: item[1] }; });
      app.requests = {};
      app.schedules = {};
      save();
      ui.flash = "예시 12명을 넣었습니다. 오프를 신청한 뒤 근무표를 만드세요.";
      ui.tab = "인원";
    } else if (act === "pick" || act === "focus") { ui.focusId = id; ui.showAll = act === "focus" ? false : ui.showAll; }
    else if (act === "toggle-off") {
      const dates = requestsFor(id);
      const iso = button.dataset.iso;
      const at = dates.indexOf(iso);
      if (at >= 0) dates.splice(at, 1); else dates.push(iso);
      setRequests(id, dates.sort());
      save();
    } else if (act === "hide-holiday") {
      if (button.dataset.extra === "1") app.extraHolidays = app.extraHolidays.filter(function (item) { return item.date !== button.dataset.iso; });
      else if (app.removedHolidays.indexOf(button.dataset.iso) < 0) app.removedHolidays.push(button.dataset.iso);
      save();
    } else if (act === "restore-holiday") {
      app.removedHolidays = app.removedHolidays.filter(function (iso) { return iso !== button.dataset.iso; });
      save();
    } else if (act === "add-holiday") {
      const date = document.getElementById("holidate").value;
      const name = document.getElementById("holiname").value.trim() || "휴무";
      if (!date) { ui.flash = "날짜를 선택해 주세요."; }
      else {
        app.removedHolidays = app.removedHolidays.filter(function (iso) { return iso !== date; });
        app.extraHolidays = app.extraHolidays.filter(function (item) { return item.date !== date; });
        if (!HOLIDAYS[date]) app.extraHolidays.push({ date: date, name: name });
        save();
      }
    } else if (act === "generate") { generate().then(renderEditor); return; }
    else if (act === "toggle-all") { ui.showAll = !ui.showAll; if (!ui.showAll) ui.editGrid = false; }
    else if (act === "edit-grid") ui.editGrid = !ui.editGrid;
    else if (act === "every-row") ui.showEveryRow = true;
    else if (act === "more-warn") ui.moreWarn = !ui.moreWarn;
    else if (act === "cycle") {
      const grid = app.schedules[currentKey()] && app.schedules[currentKey()][id];
      if (grid) {
        const order = ["OFF", "D", "E", "N"];
        const at = order.indexOf(grid[Number(button.dataset.day)]);
        grid[Number(button.dataset.day)] = order[(at + 1) % order.length];
        save();
      }
    } else if (act === "download-all" || act === "download-one") {
      const focus = act === "download-one" ? id : "";
      const person = focus ? findStaff(focus) : null;
      download(safeName((app.wardName || "근무표") + "_" + currentKey() + (person ? "_" + person.name : "")) + ".html", shareDocument(viewPayload(focus)), "text/html");
      ui.flash = "파일을 저장했습니다. 그 파일을 근무자에게 보내 주세요.";
    } else if (act === "copy-all" || act === "copy-one") { copyLink(act === "copy-one" ? id : "").then(renderEditor); return; }
    else if (act === "backup") {
      download(safeName((app.wardName || "근무표") + "_백업") + ".json", JSON.stringify(app), "application/json");
      ui.flash = "백업 파일을 저장했습니다.";
    } else if (act === "pick-restore") { document.getElementById("restore").click(); return; }
    else if (act === "reset") {
      if (window.confirm("저장된 인원, 오프, 근무표를 모두 지울까요?")) {
        localStorage.removeItem(KEY);
        app = defaultApp();
        ui.flash = "데이터를 지웠습니다.";
      }
    }
    renderEditor();
  }

  function onChange(event) {
    const el = event.target;
    if (el.id === "ward") app.wardName = el.value.trim();
    else if (el.id === "wdtarget") app.weekdayTarget = el.value;
    else if (el.id === "wetarget") app.weekendTarget = el.value;
    else if (el.dataset.shift) app.shifts[el.dataset.shift][el.dataset.part] = el.value;
    else if (el.dataset.staff) {
      const person = findStaff(el.dataset.staff);
      if (person) person[el.dataset.prop] = el.dataset.prop === "name" ? el.value.trim() : el.value;
    } else if (el.id === "restore" && el.files && el.files[0]) {
      const reader = new FileReader();
      reader.onload = function () {
        try {
          const data = JSON.parse(reader.result);
          if (!data || !Array.isArray(data.staff)) throw new Error("형식");
          app = Object.assign(defaultApp(), data);
          save();
          ui.flash = "백업을 불러왔습니다.";
        } catch (err) { ui.flash = "백업 파일을 읽지 못했습니다."; }
        renderEditor();
      };
      reader.readAsText(el.files[0]);
      return;
    } else return;
    save();
    renderEditor();
  }
  function onInput(event) {
    if (event.target.id === "find") {
      ui.query = event.target.value;
      const pos = event.target.selectionStart;
      renderEditor();
      const box = document.getElementById("find");
      if (box) { box.focus(); box.selectionStart = box.selectionEnd = pos; }
    } else if (event.target.id === "sharefind") {
      ui.shareQuery = event.target.value;
      const pos = event.target.selectionStart;
      renderEditor();
      const box = document.getElementById("sharefind");
      if (box) { box.focus(); box.selectionStart = box.selectionEnd = pos; }
    }
  }

  function bootHash(raw) {
    const cut = raw.lastIndexOf("~");
    let packed = raw;
    let focus = "";
    if (cut > 1 && raw.slice(cut + 1).charAt(0) === "s") {
      packed = raw.slice(0, cut);
      focus = raw.slice(cut + 1);
    }
    root.innerHTML = '<main class="wrap"><p>근무표를 열고 있습니다.</p></main>';
    unpackPayload(packed).then(function (payload) {
      if (focus) payload.focus = focus;
      renderViewer(payload);
    }).catch(function () {
      root.innerHTML = '<main class="wrap"><h1>근무표를 열지 못했습니다</h1><p class="help">링크가 잘렸거나 파일이 바뀌었습니다. 근무표를 만든 사람에게 파일을 다시 받아 주세요.</p></main>';
    });
  }

  document.addEventListener("click", onClick);
  document.addEventListener("change", onChange);
  document.addEventListener("input", onInput);
  if (location.hash.indexOf("#v1.") === 0) bootHash(decodeURIComponent(location.hash.slice(4)));
  else renderEditor();
})();

</script>
</body>
</html>
